[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceforge-studio"
version = "1.0.2"
description = "Local-First AI Voiceover Generator for Faceless YouTube Creators"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT (Application Code) — See THIRD_PARTY_NOTICES.md and LICENSES.md for Bundled Engine and Model Terms"}
authors = [
    {name = "VoiceForge Engineering"}
]
dependencies = [
    "PySide6>=6.6.0,<6.9.0",
    "numpy>=1.26.0,<2.3.0",
    "onnxruntime>=1.17.0,<2.0.0",
    "piper-tts>=1.2.0",
    "python-docx>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pyinstaller>=6.10.0,<7.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
voiceforge-studio = "app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
